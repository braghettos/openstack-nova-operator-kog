name: ci

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.15.0

      - name: helm lint
        # The chart hard-fails when authBridge.upstreamUrl is empty (it
        # must be supplied at install time), so feed a placeholder for
        # lint to exercise template rendering.
        run: helm lint chart --set authBridge.upstreamUrl=https://example.invalid

      - name: helm template
        run: helm template nova chart --namespace krateo-system --set authBridge.upstreamUrl=https://example.invalid > /tmp/rendered.yaml

      - name: kubeconform
        uses: docker://ghcr.io/yannh/kubeconform:latest
        with:
          # Allow CRD kinds we depend on (RestDefinition, Server,
          # BearerAuth) without bundling their schemas.
          args: -strict -ignore-missing-schemas -summary /tmp/rendered.yaml

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        uses: ludeeus/action-shellcheck@2.0.0
        with:
          scandir: ./scripts
