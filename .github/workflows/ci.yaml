name: ci

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.15.0

      - name: helm lint
        # The chart hard-fails when authBridge.upstreamUrl is empty (it
        # must be supplied at install time), so feed a placeholder for
        # lint to exercise template rendering.
        run: helm lint chart --set authBridge.upstreamUrl=https://example.invalid

      - name: helm template
        # Write into the workspace so it's visible to the kubeconform
        # docker action (which only mounts /github/workspace).
        run: helm template nova chart --namespace krateo-system --set authBridge.upstreamUrl=https://example.invalid > rendered.yaml

      - name: kubeconform
        uses: docker://ghcr.io/yannh/kubeconform:latest
        with:
          # -ignore-missing-schemas allows the CRD kinds we depend on
          # (RestDefinition, Instance, InstanceConfiguration) which aren't
          # part of the upstream Kubernetes schema bundle.
          args: -strict -ignore-missing-schemas -summary rendered.yaml

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        uses: ludeeus/action-shellcheck@2.0.0
        with:
          scandir: ./scripts
