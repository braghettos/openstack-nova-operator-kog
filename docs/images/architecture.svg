<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1320 640" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/>
    </marker>
    <marker id="arrowRose" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#e11d48"/>
    </marker>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f8fafc"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="1320" height="640" fill="url(#bg)"/>

  <!-- Title -->
  <text x="660" y="54" text-anchor="middle" font-size="34" font-weight="700" fill="#0f172a">From <tspan font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#326CE5">kubectl apply</tspan> to a running OpenStack VM</text>
  <text x="660" y="88" text-anchor="middle" font-size="18" fill="#475569">Krateo KOG · OpenStack Nova · a stateless header-rewrite auth-bridge</text>
  <line x1="510" y1="106" x2="810" y2="106" stroke="#e2e8f0" stroke-width="2"/>

  <!-- Group panels -->
  <rect x="20" y="250" width="730" height="250" rx="16" fill="#eef4ff" stroke="#326CE5" stroke-width="2" stroke-dasharray="6 5"/>
  <text x="385" y="282" text-anchor="middle" font-size="15" font-weight="700" fill="#326CE5">Kubernetes cluster (kind)</text>

  <rect x="826" y="250" width="474" height="250" rx="16" fill="#eef0fb" stroke="#0a2a8c" stroke-width="2" stroke-dasharray="6 5"/>
  <text x="1063" y="282" text-anchor="middle" font-size="15" font-weight="700" fill="#0a2a8c">OpenStack Nova — OVH Public Cloud</text>

  <!-- kubectl actor -->
  <rect x="40" y="170" width="170" height="44" rx="10" fill="#0f172a"/>
  <text x="125" y="198" text-anchor="middle" font-size="15" font-weight="600" fill="#ffffff" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">kubectl apply</text>
  <line x1="125" y1="216" x2="125" y2="326" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Nodes -->
  <!-- n1 Instance CR -->
  <rect x="40" y="330" width="170" height="84" rx="12" fill="#ffffff" stroke="#6366f1" stroke-width="1.8" filter="url(#sh)"/>
  <text x="125" y="366" text-anchor="middle" font-size="16" font-weight="600" fill="#0f172a">Instance CR</text>
  <text x="125" y="388" text-anchor="middle" font-size="11" fill="#64748b">nova.openstack.krateo.io</text>

  <!-- n2 controller -->
  <rect x="302" y="330" width="170" height="84" rx="12" fill="#ffffff" stroke="#326CE5" stroke-width="1.8" filter="url(#sh)"/>
  <text x="387" y="362" text-anchor="middle" font-size="15" font-weight="600" fill="#0f172a">rest-dynamic-</text>
  <text x="387" y="382" text-anchor="middle" font-size="15" font-weight="600" fill="#0f172a">controller</text>

  <!-- n3 auth-bridge -->
  <rect x="564" y="330" width="170" height="84" rx="12" fill="#ffffff" stroke="#009639" stroke-width="1.8" filter="url(#sh)"/>
  <text x="649" y="366" text-anchor="middle" font-size="16" font-weight="600" fill="#0f172a">nova-auth-bridge</text>
  <text x="649" y="388" text-anchor="middle" font-size="11" fill="#64748b">nginx</text>

  <!-- n4 Nova API -->
  <rect x="856" y="330" width="170" height="84" rx="12" fill="#ffffff" stroke="#0a2a8c" stroke-width="1.8" filter="url(#sh)"/>
  <text x="941" y="366" text-anchor="middle" font-size="16" font-weight="600" fill="#0f172a">Nova Compute API</text>
  <text x="941" y="388" text-anchor="middle" font-size="11" fill="#64748b">compute.gra9…</text>

  <!-- n5 VM -->
  <rect x="1118" y="330" width="170" height="84" rx="12" fill="#ecfdf5" stroke="#10b981" stroke-width="1.8" filter="url(#sh)"/>
  <text x="1203" y="362" text-anchor="middle" font-size="17" font-weight="700" fill="#065f46">VM</text>
  <circle cx="1170" cy="384" r="5" fill="#10b981"/>
  <text x="1210" y="389" text-anchor="middle" font-size="13" font-weight="600" fill="#047857">ACTIVE</text>

  <!-- Arrows -->
  <line x1="216" y1="372" x2="296" y2="372" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="256" y="360" text-anchor="middle" font-size="12" fill="#475569">reconciles</text>

  <line x1="478" y1="372" x2="558" y2="372" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="518" y="360" text-anchor="middle" font-size="12" fill="#475569" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">Bearer t</text>

  <line x1="740" y1="372" x2="850" y2="372" stroke="#e11d48" stroke-width="2.6" marker-end="url(#arrowRose)"/>
  <text x="795" y="356" text-anchor="middle" font-size="13" font-weight="700" fill="#e11d48" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">X-Auth-Token</text>
  <text x="795" y="394" text-anchor="middle" font-size="11" fill="#9f1239">rewritten by nginx</text>

  <line x1="1032" y1="372" x2="1112" y2="372" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="1072" y="360" text-anchor="middle" font-size="12" fill="#475569">boots</text>

  <!-- Caption -->
  <text x="660" y="556" text-anchor="middle" font-size="16" font-style="italic" fill="#64748b">One <tspan font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-style="normal">kubectl apply</tspan> → real compute on OpenStack — no bespoke operator code, just an OpenAPI spec.</text>
</svg>
