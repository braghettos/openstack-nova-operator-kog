# Holds the pre-fetched Keystone token. Refresh by replacing the Secret
# (see scripts/get-token.sh). The chart's auth-bridge will rewrite the
# Authorization: Bearer header that the Rest Dynamic Controller emits
# into the X-Auth-Token header that Nova expects.
apiVersion: v1
kind: Secret
metadata:
  name: nova-token
  namespace: krateo-system
type: Opaque
stringData:
  # Replace with a valid Keystone token. Tokens expire (~1h on OVH).
  token: "REPLACE_WITH_KEYSTONE_TOKEN"
---
# BearerAuth CRD instance is auto-generated by oasgen-provider as a
# side-effect of the Server RestDefinition (because the OAS declares an
# `http/bearer` security scheme). The generated GVK lives under the
# `resourceGroup` configured in values.yaml.
apiVersion: nova.openstack.krateo.io/v1alpha1
kind: BearerAuth
metadata:
  name: nova-bearer
  namespace: krateo-system
spec:
  tokenRef:
    name: nova-token
    namespace: krateo-system
    key: token
