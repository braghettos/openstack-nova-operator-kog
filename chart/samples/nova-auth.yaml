# InstanceConfiguration is auto-generated by oasgen-provider as a
# side-effect of the RestDefinition: because the OAS declares an
# `http/bearer` security scheme, the generated <Kind>Configuration CRD
# carries the authentication block. The Instance CR references this
# Configuration via spec.configurationRef.
#
# This file intentionally does NOT define the `nova-token` Secret. The
# Secret is created (and refreshed) out-of-band by:
#
#   ./scripts/get-token.sh --secret | kubectl apply -f -
#
# Keeping the Secret in a single source avoids accidentally overwriting
# a freshly fetched token with a stale placeholder. If you prefer to set
# it by hand:
#
#   kubectl -n krateo-system create secret generic nova-token \
#     --from-literal=token="<keystone-token>"
apiVersion: nova.openstack.krateo.io/v1alpha1
kind: InstanceConfiguration
metadata:
  name: nova-config
  namespace: krateo-system
spec:
  authentication:
    bearer:
      tokenRef:
        name: nova-token
        namespace: krateo-system
        key: token
