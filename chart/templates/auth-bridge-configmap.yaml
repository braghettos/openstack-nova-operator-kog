{{- if .Values.authBridge.enabled }}
{{- if not .Values.authBridge.upstreamUrl }}
{{- fail "authBridge.upstreamUrl must be set to the OVH Nova endpoint (e.g. https://compute.gra11.cloud.ovh.net/v2.1/<projectId>)" }}
{{- end }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "openstack-nova-operator-kog.authBridgeName" . }}
  labels:
    {{- include "openstack-nova-operator-kog.labels" . | nindent 4 }}
data:
  default.conf: |
    # Strip "Bearer " prefix from Authorization header into $os_token.
    map $http_authorization $os_token {
        default                  "";
        "~*^Bearer\s+(.+)$"     $1;
    }

    server {
        listen       80 default_server;
        server_name  _;

        resolver 1.1.1.1 1.0.0.1 ipv6=off valid=300s;
        resolver_timeout 5s;

        location / {
            # Forward to the real OVH Nova endpoint, swapping the
            # Authorization: Bearer <t>  header for the X-Auth-Token: <t>
            # header that OpenStack expects. No token exchange happens
            # here - this is a stateless header rewrite.
            proxy_pass         {{ .Values.authBridge.upstreamUrl }}$request_uri;
            proxy_ssl_server_name on;

            proxy_set_header   Host              $proxy_host;
            proxy_set_header   X-Auth-Token      $os_token;
            proxy_set_header   Accept            "application/json";
            proxy_set_header   Content-Type      "application/json";
            proxy_pass_request_headers off;

            proxy_read_timeout 60s;
            proxy_connect_timeout 10s;
        }

        location = /healthz {
            access_log off;
            return 200 "ok\n";
        }
    }
{{- end }}
